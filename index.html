

<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Welcome to Welcome to Test Bakery"
  >

  <title>
    Welcome to Test Bakery
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


<header class="site-header">

  <div class="brand">

    <img
      src="data:image/svg+xml;base64,CjxzdmcgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIgogICAgIHdpZHRoPSI4MCIKICAgICBoZWlnaHQ9IjgwIgogICAgIHZpZXdCb3g9IjAgMCA4MCA4MCI+CgogIDxyZWN0CiAgICB3aWR0aD0iODAiCiAgICBoZWlnaHQ9IjgwIgogICAgcng9IjE4IgogICAgZmlsbD0iI0ZGOEMwMCIKICAvPgoKICA8dGV4dAogICAgeD0iNTAlIgogICAgeT0iNTAlIgogICAgZm9udC1mYW1pbHk9IkFyaWFsIgogICAgZm9udC1zaXplPSIyOCIKICAgIGZvbnQtd2VpZ2h0PSJib2xkIgogICAgZmlsbD0id2hpdGUiCiAgICB0ZXh0LWFuY2hvcj0ibWlkZGxlIgogICAgZG9taW5hbnQtYmFzZWxpbmU9ImNlbnRyYWwiPgogICAgV1QKICA8L3RleHQ+Cgo8L3N2Zz4K"
      alt="Welcome to Test Bakery logo"
    >

    <span class="brand-title">
      Welcome to Test Bakery
    </span>

  </div>


  <nav class="main-nav">

    
    <a
      href="#hero"
      class="nav-link"
      data-slide="hero">
      Welcome to Test Bakery
    </a>
  
    <a
      href="#bakery-story"
      class="nav-link"
      data-slide="bakery-story">
      Our Story
    </a>
  
    <a
      href="#menu"
      class="nav-link"
      data-slide="menu">
      Menu
    </a>
  
    <a
      href="#featured-products"
      class="nav-link"
      data-slide="featured-products">
      Featured Products
    </a>
  
    <a
      href="#contact"
      class="nav-link"
      data-slide="contact">
      Get In Touch
    </a>
  

  </nav>

</header>


<main>

  

<section
  id="hero"
  class="site-slide hero-slide"
  data-index="0">

  <div class="slide-overlay"></div>

  <div class="slide-container">

    <div class="slide-content">

      <span class="slide-number">
        01
      </span>

      <h2>
        Welcome to Test Bakery
      </h2>

      

      
            <button
              class="primary-btn"
              data-next>
              Explore More
              <span>→</span>
            </button>
          

    </div>

    
        <div class="slide-image-wrapper">

          <img
            class="slide-image"
            src="https://images.pexels.com/photos/39061354/pexels-photo-39061354.jpeg?auto=compress&amp;cs=tinysrgb&amp;h=650&amp;w=940"
            alt="Inviting entrance of a rustic bakery shop with decorative elements on a sunny day."
            loading="eager"
          />

        </div>
      

  </div>

  

  
        <button
          class="slide-arrow next"
          data-next
          aria-label="Next slide">
          ↓
        </button>
      

</section>

      

<section
  id="bakery-story"
  class="site-slide content-slide"
  data-index="1">

  <div class="slide-overlay"></div>

  <div class="slide-container">

    <div class="slide-content">

      <span class="slide-number">
        02
      </span>

      <h2>
        Our Story
      </h2>

      

      

    </div>

    
        <div class="slide-image-wrapper">

          <img
            class="slide-image"
            src="https://images.pexels.com/photos/5713769/pexels-photo-5713769.jpeg?auto=compress&amp;cs=tinysrgb&amp;h=650&amp;w=940"
            alt="A vibrant bakery display with a variety of breads and pastries arranged on wooden racks."
            loading="lazy"
          />

        </div>
      

  </div>

  
        <button
          class="slide-arrow prev"
          data-prev
          aria-label="Previous slide">
          ↑
        </button>
      

  
        <button
          class="slide-arrow next"
          data-next
          aria-label="Next slide">
          ↓
        </button>
      

</section>

      

<section
  id="menu"
  class="site-slide content-slide"
  data-index="2">

  <div class="slide-overlay"></div>

  <div class="slide-container">

    <div class="slide-content">

      <span class="slide-number">
        03
      </span>

      <h2>
        Menu
      </h2>

      

      

    </div>

    
        <div class="slide-image-wrapper">

          <img
            class="slide-image"
            src="https://images.pexels.com/photos/34164496/pexels-photo-34164496.jpeg?auto=compress&amp;cs=tinysrgb&amp;h=650&amp;w=940"
            alt="A vibrant bakery sign showcases pastry and cakes outside a cozy cafe."
            loading="lazy"
          />

        </div>
      

  </div>

  
        <button
          class="slide-arrow prev"
          data-prev
          aria-label="Previous slide">
          ↑
        </button>
      

  
        <button
          class="slide-arrow next"
          data-next
          aria-label="Next slide">
          ↓
        </button>
      

</section>

      

<section
  id="featured-products"
  class="site-slide content-slide"
  data-index="3">

  <div class="slide-overlay"></div>

  <div class="slide-container">

    <div class="slide-content">

      <span class="slide-number">
        04
      </span>

      <h2>
        Featured Products
      </h2>

      

      

    </div>

    
        <div class="slide-image-wrapper">

          <img
            class="slide-image"
            src="https://images.pexels.com/photos/11288937/pexels-photo-11288937.jpeg?auto=compress&amp;cs=tinysrgb&amp;h=650&amp;w=940"
            alt="Assorted pastries and baked goods arranged in a charming glass cabinet for a mouthwatering showcase."
            loading="lazy"
          />

        </div>
      

  </div>

  
        <button
          class="slide-arrow prev"
          data-prev
          aria-label="Previous slide">
          ↑
        </button>
      

  
        <button
          class="slide-arrow next"
          data-next
          aria-label="Next slide">
          ↓
        </button>
      

</section>

      

<section
  id="contact"
  class="site-slide content-slide"
  data-index="4">

  <div class="slide-overlay"></div>

  <div class="slide-container">

    <div class="slide-content">

      <span class="slide-number">
        05
      </span>

      <h2>
        Get In Touch
      </h2>

      

      

    </div>

    
        <div class="slide-image-wrapper">

          <img
            class="slide-image"
            src="https://images.pexels.com/photos/14800887/pexels-photo-14800887.jpeg?auto=compress&amp;cs=tinysrgb&amp;h=650&amp;w=940"
            alt="A close-up shot of dough being piped onto parchment paper, highlighting the art of baking."
            loading="lazy"
          />

        </div>
      

  </div>

  
        <button
          class="slide-arrow prev"
          data-prev
          aria-label="Previous slide">
          ↑
        </button>
      

  

</section>

      

</main>


<!-- DOT NAVIGATION -->

<div class="slide-dots">

  
        <button
          class="dot active"
          data-target="hero"
          aria-label="Go to Welcome to Test Bakery">
        </button>
      
        <button
          class="dot "
          data-target="bakery-story"
          aria-label="Go to Our Story">
        </button>
      
        <button
          class="dot "
          data-target="menu"
          aria-label="Go to Menu">
        </button>
      
        <button
          class="dot "
          data-target="featured-products"
          aria-label="Go to Featured Products">
        </button>
      
        <button
          class="dot "
          data-target="contact"
          aria-label="Go to Get In Touch">
        </button>
      

</div>


<footer class="site-footer">

  

  <p>
    © 2026 Welcome to Test Bakery
  </p>

</footer>


<script src="script.js"></script>

</body>

</html>
